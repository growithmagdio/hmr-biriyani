<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%">
  <defs>
    <!-- Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28B8B0" />
      <stop offset="100%" stop-color="#11635F" />
    </linearGradient>
    <!-- Gold Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BE4D" />
      <stop offset="50%" stop-color="#E3A72F" />
      <stop offset="100%" stop-color="#B8821B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Teal Oval with Gold Border -->
  <ellipse cx="160" cy="55" rx="145" ry="46" fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="drop-shadow(0 4px 12px rgba(26, 154, 147, 0.45))" />
  
  <!-- Subtle Inner Ring -->
  <ellipse cx="160" cy="55" rx="138" ry="40" fill="none" stroke="#FAF6EE" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 2" />

  <!-- HMR Bold Monogram -->
  <text x="160" y="67" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#FAF6EE" 
        text-anchor="middle"
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">HMR</text>

  <!-- Subtitle Tagline Inside Oval -->
  <text x="160" y="87" 
        font-family="'Inter', sans-serif" 
        font-size="9" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="#F5BE4D" 
        text-anchor="middle">SINCE 1998 · R.S. PURAM</text>

  <!-- "BIRIYANI HUT" Banner below -->
  <text x="160" y="125" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#FAF6EE" 
        text-anchor="middle">BIRIYANI HUT</text>
  
  <!-- Decorative Accent Underline -->
  <path d="M 85 133 L 150 133 M 170 133 L 235 133" stroke="#E3A72F" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="160" cy="133" r="2.5" fill="#E3A72F" />
</svg>
